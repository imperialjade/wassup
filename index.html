<!DOCTYPE html>
<html>
<head>
    <title>Global Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    margin: 0; 
    padding-bottom: 70px; /* Space for the input box */
    background: #f0f2f5; 
}

#messages { 
    list-style-type: none; 
    margin: 0; 
    padding: 15px; 
    display: flex;
    flex-direction: column;
}

#messages > li { 
    padding: 10px 15px; 
    background: #fff; 
    margin-bottom: 10px; 
    border-radius: 18px; 
    box-shadow: 0 1px 1px rgba(0,0,0,0.1); 
    max-width: 85%; /* Prevents messages from stretching too wide on desktop */
    word-wrap: break-word; /* Prevents long words from breaking the layout */
}

#form { 
    background: ##000000; 
    padding: 10px; 
    position: fixed; 
    bottom: 0; 
    left: 0; 
    right: 0; 
    display: flex; 
    border-top: 1px solid #ddd;
    box-sizing: border-box; /* Ensures padding doesn't push the form off-screen */
}

#input { 
    border: 1px solid #ccc; 
    padding: 12px 15px; 
    flex-grow: 1; 
    border-radius: 25px; 
    outline: none; 
    font-size: 16px; /* Prevents iOS from auto-zooming on input focus */
}

#form > button { 
    background: ##000000; 
    border: none; 
    padding: 0 20px; 
    margin-left: 8px; 
    border-radius: 25px; 
    color: #fff; 
    font-weight: bold;
    cursor: pointer; 
}
    </style>
</head>
<body>
    <ul id="messages"></ul>
    <form id="form" action="">
        <input id="input" autocomplete="off" placeholder="Type a message..." /><button>Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io();
        var form = document.getElementById('form');
        var input = document.getElementById('input');
        var messages = document.getElementById('messages');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (input.value) {
                socket.emit('chat message', input.value);
                input.value = '';
            }
        });

        socket.on('chat message', function(msg) {
            var item = document.createElement('li');
            item.textContent = msg;
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);
        });
    </script>
</body>
</html>
