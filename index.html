<!DOCTYPE html>
<html>
<head>
    <title>Global Chat</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding-bottom: 3rem; background: #f4f4f9; }
        #form { background: #fff; padding: 0.5rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; border-top: 1px solid #ccc; }
        #input { border: 1px solid #ddd; padding: 0.5rem 1rem; flex-grow: 1; border-radius: 20px; outline: none; }
        #form > button { background: #333; border: none; padding: 0 1.5rem; margin-left: 0.5rem; border-radius: 20px; color: #fff; cursor: pointer; }
        #messages { list-style-type: none; margin: 0; padding: 1rem; }
        #messages > li { padding: 0.5rem 1rem; background: #fff; margin-bottom: 0.5rem; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <ul id="messages"></ul>
    <form id="form" action="">
        <input id="input" autocomplete="off" placeholder="Type a message..." /><button>Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io();
        var form = document.getElementById('form');
        var input = document.getElementById('input');
        var messages = document.getElementById('messages');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (input.value) {
                socket.emit('chat message', input.value);
                input.value = '';
            }
        });

        socket.on('chat message', function(msg) {
            var item = document.createElement('li');
            item.textContent = msg;
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);
        });
    </script>
</body>
</html>
